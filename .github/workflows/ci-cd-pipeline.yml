name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Stage 1a: Gitleaks Secret Scan ──────────────────────────────────
  secret-scan-gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Stage 1b: TruffleHog Secret Scan ────────────────────────────────
  secret-scan-trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ─── Stage 2: SAST & Linting ─────────────────────────────────────────
  sast-lint:
    name: SAST & Linting
    runs-on: ubuntu-latest
    needs: [secret-scan-gitleaks, secret-scan-trufflehog]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SAST & linting tools
        run: pip install bandit flake8 safety

      - name: Bandit — Python SAST
        run: bandit -r . --severity-level medium --exclude ./.git,./venv

      - name: Flake8 — Code Style Lint
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv

      - name: Safety — Dependency CVE Scan
        run: safety check --full-report

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: bandit-report.json
          retention-days: 14

  # ─── Stage 3: Build & Push Docker Image ──────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: sast-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 4: Patch values.yaml to trigger ArgoCD ────────────────────
  update-manifests:
    name: Update Image Tag in values.yaml
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Patch image tag
        run: |
          sed -i "s|tag:.*|tag: ${{ github.sha }}|" values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push
