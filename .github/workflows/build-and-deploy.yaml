name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ steps.vars.outputs.TAG }} ./three-tier-app/backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ steps.vars.outputs.TAG }}

      - name: Update image tags in Helm values
        run: |
          sed -i "s|tag: \".*\" # frontend-tag|tag: \"${{ steps.vars.outputs.TAG }}\" # frontend-tag|g" three-tier-app/values.yaml
          sed -i "s|tag: \".*\" # backend-tag|tag: \"${{ steps.vars.outputs.TAG }}\" # backend-tag|g" three-tier-app/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add three-tier-app/values.yaml
          git commit -m "ci: update image tags to ${{ steps.vars.outputs.TAG }}" || echo "No changes to commit"
          git push
